[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nscr-houdini-mcp"
version = "0.0.1"
description = "MCP server for SideFX Houdini 22"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
nscr-houdini-mcp = "nscr_houdini_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Only for the integration check that reads which addresses a port listens
    # on. The tests that use it skip when it is not installed.
    "psutil>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nscr_houdini_mcp"]

# The Houdini side files travel inside the package, so an installed copy can
# point Houdini at them. Without this an installed copy has no payload and
# `bridge install` has nothing to install.
[tool.hatch.build.targets.wheel.force-include]
"houdini" = "nscr_houdini_mcp/houdini"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "houdini: needs a Houdini install on this machine, skipped when there is none",
]
