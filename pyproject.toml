[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nscr-houdini-mcp"
version = "0.0.1"
description = "MCP server for SideFX Houdini 22"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
nscr-houdini-mcp = "nscr_houdini_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nscr_houdini_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
